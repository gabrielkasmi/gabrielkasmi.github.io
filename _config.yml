title: Gabriel Kasmi
description: >-
  ML scientist working on explainable AI, computer vision, and remote sensing
  for energy systems.
url: "https://gabrielkasmi.github.io"
baseurl: ""

author:
  name: Gabriel Kasmi

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

permalink: /blog/:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - README.md
  - PRODUCT.md
  - DESIGN.md
  - .impeccable
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - "*.gemspec"
