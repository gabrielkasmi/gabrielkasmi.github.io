---
layout: default
---
<article class="post">
  <p class="back-link"><a href="{{ '/blog/' | relative_url }}">← Back to Blog</a></p>
  <h1 class="post-title">{{ page.title }}</h1>
  {% if page.subtitle %}<p class="post-subtitle">{{ page.subtitle }}</p>{% endif %}
  <p class="post-meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %Y" }}</time>
    {% if page.tags %}{% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}{% endif %}
  </p>
  <div class="post-body">
    {{ content }}
  </div>
</article>
